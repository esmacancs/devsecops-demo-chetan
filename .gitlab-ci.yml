# ============================================================================
# DevSecOps Demo — GitLab CI/CD pipeline
#
# Executor: shell (opn-prime VM) — no `image:` blocks are used because a shell
# executor ignores them. Run the manual `provision-runner` job ONCE to install
# Node.js, Docker, kind and all scanner/deploy CLIs on the runner host (requires
# passwordless sudo). The automatic jobs below assume those tools exist on the
# host PATH — no per-pipeline tool downloads.
#
#   .pre  provision-runner   -> MANUAL, root/sudo job that installs Node.js 20,
#                               npm, Docker Engine, kind, kubectl/kustomize/helm/
#                               terraform and gitleaks/trivy/tfsec/kics on the
#                               runner host. Run it once; future pipelines just
#                               use the tools.
#
# Security scans (SAST, secret detection, dependency scanning, license,
# IaC, container/fs) run automatically on every merge request. They upload
# GitLab-native reports (SARIF / GitLab JSON schemas via the converters in
# scripts/) so findings show up in the **Security tab → Vulnerability Report**.
# All scans are allow_failure so the pipeline stays green while you inspect
# findings. Flip *_FAIL_ON_ISSUES to "true" (or remove the `|| true` /
# allow_failure) to make them hard gates.
#
# On `main`, the pipeline is automated up to staging, then gated:
#   test -> security scans -> build & push image -> Trivy image scan
#        -> deploy:staging -> smoke-test (verify staging)
#        -> deploy:production (MANUAL: promote only after staging passed).
#
# Staging and production are fully segregated: the kustomize overlays prefix all
# resources (namespace/deployment/service) so pod names are
# `staging-devsecops-demo-*` vs `production-devsecops-demo-*`, exposed on
# NodePort 30081 (staging) and 30080 (production).
#
# The deploy jobs load the built image into kind and `kubectl apply` the
# staging/production kustomize overlays (scripts/deploy.sh). They need kubectl
# to reach the cluster: set the KUBE_CONFIG CI variable to the content of the
# kind cluster's ~/.kube/config, or let provision-runner copy it from
# /home/ubuntu/.kube/config for the runner user.
#
# docker-preview and dast-api stay manual because they are optional extras
# (eyeballing the container, running ZAP DAST).
# ============================================================================

stages:
  - .pre
  - test
  - security
  - package
  - scan
  - preview
  - deploy
  - verify
  - promote

variables:
  APP_NAME: devsecops-demo
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  NODE_CACHE_KEY: "$CI_COMMIT_REF_SLUG"

# Share the npm cache across jobs (shell executor)
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# ----------------------------------------------------------------------------
# .pre — provision (MANUAL, one-time) + prep
# ----------------------------------------------------------------------------

# Run ONCE to install Node.js 20, Docker Engine, scanner and deploy CLIs on the
# runner host (requires passwordless sudo for the runner user).
provision-runner:
  stage: .pre
  when: manual
  script:
    - bash scripts/provision-runner.sh

# ----------------------------------------------------------------------------
# test — unit & integration
# ----------------------------------------------------------------------------

test:
  stage: test
  needs: []
  script:
    - npm ci
    - npm test
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - coverage/
      - junit.xml

# ----------------------------------------------------------------------------
# security — automatic scans (report to Security tab, non-blocking)
# ----------------------------------------------------------------------------

# SAST — ESLint with eslint-plugin-security (SARIF → GitLab Security tab)
sast-eslint:
  stage: security
  needs: [test]
  script:
    - npm ci
    - npm run sast || true
    - test -s gl-sast-report.json || printf '{"version":"2.1.0","runs":[]}' > gl-sast-report.json
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
  allow_failure: true

# Secret detection — gitleaks (SARIF → GitLab Security tab)
secret-detection:
  stage: security
  script:
    - gitleaks detect --source . --report-format sarif --report-path gl-secret-detection-report.json --no-banner || true
    - test -s gl-secret-detection-report.json || printf '{"version":"2.1.0","runs":[]}' > gl-secret-detection-report.json
  artifacts:
    when: always
    reports:
      secret_detection: gl-secret-detection-report.json
  allow_failure: true

# Dependency scanning — npm audit + Retire.js
# npm audit JSON is converted to GitLab's dependency_scanning schema.
dependency-scanning:
  stage: security
  script:
    - npm ci
    - npm audit --json > gl-npm-audit.json || true
    - node scripts/npm-audit-to-gitlab.js gl-npm-audit.json gl-dependency-scanning-report.json package-lock.json || true
    - test -s gl-dependency-scanning-report.json || printf '{"version":"14.0.0","vulnerabilities":[],"dependency_files":["package-lock.json"]}' > gl-dependency-scanning-report.json
    - npx retire --severity high --outputformat json --outputpath retire-report.json || true
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths:
      - retire-report.json
  allow_failure: true

# License compliance
license-compliance:
  stage: security
  script:
    - npm ci
    - npx license-checker --json > gl-license-scanning-report.json || true
  artifacts:
    when: always
    paths:
      - gl-license-scanning-report.json
  allow_failure: true

# IaC scanning — KICS (terraform + k8s manifests). SARIF → Security tab.
# Queries are installed by provision-runner.sh at /usr/local/share/kics/queries.
# Note: kics v2.x exits non-zero when findings exist, hence the `|| true`.
sast-iac-kics:
  stage: security
  script:
    - kics scan -p . -o . --report-formats sarif,json --output-name gl-sast-iac --queries-path /usr/local/share/kics/queries || true
    - test -s gl-sast-iac.sarif || printf '{"version":"2.1.0","runs":[]}' > gl-sast-iac.sarif
  artifacts:
    when: always
    reports:
      sast: gl-sast-iac.sarif
    paths:
      - gl-sast-iac.json
  allow_failure: true

# IaC scanning — tfsec (terraform). SARIF → Security tab.
sast-iac-tfsec:
  stage: security
  script:
    - tfsec terraform --format sarif --out gl-tfsec-report.json || true
    - test -s gl-tfsec-report.json || printf '{"version":"2.1.0","runs":[]}' > gl-tfsec-report.json
  artifacts:
    when: always
    reports:
      sast: gl-tfsec-report.json
  allow_failure: true

# Container scanning (filesystem mode) — Trivy, no Docker required.
# Full image scan (container-scanning-image) runs after build-image.
container-scanning-fs:
  stage: security
  script:
    - trivy fs --format json --exit-code 0 --output gl-container-scanning-report.json .
  artifacts:
    when: always
    paths:
      - gl-container-scanning-report.json
  allow_failure: true

# DAST API — ZAP against a deployed instance. Requires Docker + a reachable URL.
# 1) deploy to staging  2) set DAST_TARGET_URL (CI variable / run variable)
# 3) run this job manually.
dast-api:
  stage: security
  when: manual
  allow_failure: true
  script:
    - test -n "$DAST_TARGET_URL" || (echo "Set DAST_TARGET_URL, e.g. https://staging.example.com"; exit 1)
    - docker run --rm -v "$CI_PROJECT_DIR:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -r /zap/wrk/gl-dast-report.html -z "-X $DAST_TARGET_URL" || true
  artifacts:
    when: always
    paths:
      - gl-dast-report.html

# ----------------------------------------------------------------------------
# package — build & push container image (automatic on main)
# ----------------------------------------------------------------------------

build-image:
  stage: package
  only:
    - main
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    - docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Full container image vulnerability scan (needs Docker + built image)
# Lives in the 'scan' stage (after 'package') because it needs the built image.
# Trivy JSON is converted to GitLab's container_scanning schema (Security tab).
container-scanning-image:
  stage: scan
  allow_failure: true
  needs: [build-image]
  only:
    - main
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$IMAGE_TAG"
    - trivy image --format json --exit-code 0 --output gl-trivy.json "$IMAGE_TAG" || true
    - node scripts/trivy-to-gitlab.js gl-trivy.json gl-container-image-report.json || true
    - test -s gl-container-image-report.json || printf '{"version":"4.0.0","vulnerabilities":[]}' > gl-container-image-report.json
    - trivy image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE_TAG" || true
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-image-report.json
    paths:
      - gl-trivy.json
  allow_failure: true

# ----------------------------------------------------------------------------
# preview — run the app in Docker on the runner host so you can eyeball it
# in a browser before deploying to staging/prod. Manual; does not block deploy.
# ----------------------------------------------------------------------------

# Build the image locally and run it on port 8080 of the runner host.
# Open http://<runner-ip>:8080/ (and /health) in a browser to see the app.
docker-preview:
  stage: preview
  when: manual
  only:
    - main
  script:
    - bash scripts/docker-preview.sh

# Remove the preview container from the runner host.
docker-preview:stop:
  stage: preview
  when: manual
  only:
    - main
  script:
    - docker rm -f devsecops-demo-preview >/dev/null 2>&1 && echo "preview container stopped" || echo "no preview container running"

# ----------------------------------------------------------------------------
# deploy + verify + promote — automatic staging deploy on main, then a manual
# promotion gate for production. scripts/deploy.sh loads the image into kind,
# pins the exact commit tag and applies the overlay via kubectl + kustomize.
# ----------------------------------------------------------------------------

deploy:staging:
  stage: deploy
  needs: [build-image]
  only:
    - main
  environment:
    name: staging
    url: http://10.0.170.128:30081
  script:
    - bash scripts/deploy.sh staging

# Gate between staging and production: runs automatically after deploy:staging.
# If this fails, the pipeline is blocked and deploy:production can't be run.
smoke-test:
  stage: verify
  needs: [deploy:staging]
  only:
    - main
  environment:
    name: staging
    action: verify
  script:
    - bash scripts/smoke-test.sh staging

# Promotion is manual: it only appears once deploy:staging AND smoke-test
# succeed on main, and requires a human click to run.
deploy:production:
  stage: promote
  needs: [smoke-test]
  when: manual
  allow_failure: false
  only:
    - main
  environment:
    name: production
    url: http://10.0.170.128:30080
  script:
    - bash scripts/deploy.sh production
