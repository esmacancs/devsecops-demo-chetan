openapi: 3.0.3
info:
  title: Coffee Shop
  description: Coffee Shop website served by the DevSecOps demo pipeline (also consumed by GitLab DAST API).
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://staging.example.com
    description: Staging
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
